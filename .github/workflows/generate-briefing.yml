# .github/workflows/generate-briefing.yml
#
# Runs every weekday morning at 1:30 PM UTC (8:30 AM ET / 5:30 AM PT)
# Calls the Claude API to generate the stock briefing, then commits
# the HTML to the repo so GitHub Pages serves the latest version.
#
# Required secrets:
#   ANTHROPIC_API_KEY — Your Claude API key from console.anthropic.com

name: Morning Stock Briefing

on:
  schedule:
    # Weekdays at 1:30 PM UTC = 8:30 AM ET = 5:30 AM PT
    # Adjust for your timezone. Korea time (KST) = UTC+9, so 1:30 PM UTC = 10:30 PM KST
    - cron: '30 13 * * 1-5'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Anthropic SDK
        run: pip install anthropic

      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python generate.py

      - name: Commit and push
        run: |
          git config user.name "Stock Briefing Bot"
          git config user.email "bot@noreply.github.com"
          git add site/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date +%Y-%m-%d)
            git commit -m "Briefing update: ${DATE}"
            git push
          fi
